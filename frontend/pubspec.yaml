name: frontend
description: "FancyWorld - Premium Luxury E-Commerce App"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http_parser: ^4.1.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  dio: ^5.4.3+1
  http: ^1.6.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  image_picker: ^1.2.3
  carousel_slider: ^5.1.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.66.0
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1
  fluttertoast: ^9.1.0  
  percent_indicator: ^4.2.3
  socket_io_client: ^2.0.3+1
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  app_links: ^6.3.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.10.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  razorpay_flutter: ^1.3.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/sm_fancy_icon.png
    - assets/images/logo1.png
    - assets/images/banner4.jpg
    - assets/images/banner5.jpg
    - assets/images/products/
    - assets/images/category_icons/
    - assets/fonts/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sm_fancy_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/images/sm_fancy_icon.png"
