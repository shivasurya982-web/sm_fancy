<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Siva Murugan Fancy - Luxury E-commerce">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FancyWorld">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Material Icons & Web Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

  <!-- Toastify CSS & JS for FlutterToast on Web -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- Razorpay Checkout JS for Flutter Web -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    function openRazorpayWebCheckout(keyId, amount, razorpayOrderId, name, email, phone, orderNumber, successCbName, errorCbName) {
      if (typeof Razorpay === 'undefined') {
        if (window[errorCbName]) window[errorCbName]('Razorpay Web JS SDK not loaded');
        return;
      }
      var options = {
        key: keyId,
        amount: amount,
        currency: 'INR',
        name: 'SM Fancy',
        description: 'Order #' + (orderNumber || ''),
        order_id: razorpayOrderId,
        prefill: {
          name: name,
          email: email,
          contact: phone
        },
        theme: { color: '#E5E4E2' },
        handler: function (response) {
          if (window[successCbName]) {
            window[successCbName](response.razorpay_order_id, response.razorpay_payment_id, response.razorpay_signature);
          }
        },
        modal: {
          ondismiss: function() {
            if (window[errorCbName]) window[errorCbName]('Payment dismissed by user');
          }
        }
      };
      var rzp = new Razorpay(options);
      rzp.on('payment.failed', function (resp) {
        if (window[errorCbName]) window[errorCbName](resp.error ? resp.error.description : 'Payment failed');
      });
      rzp.open();
    }
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FancyWorld Luxury</title>
  <link rel="manifest" href="manifest.json">
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAO42eETDChqAFDQh2qxy_X88LG6-cnCAw&loading=async"></script>

  <style>
    body {
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: serif;
    }
    .loader {
      border: 3px solid #1a1a1a;
      border-top: 3px solid #E5E4E2;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      var checkFlutter = setInterval(function() {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          var loading = document.querySelector('#loading');
          if (loading) loading.style.display = 'none';
          clearInterval(checkFlutter);
        }
      }, 100);
      setTimeout(function() {
        var loading = document.querySelector('#loading');
        if (loading) loading.style.display = 'none';
        clearInterval(checkFlutter);
      }, 3500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
